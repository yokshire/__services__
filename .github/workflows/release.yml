name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packages
        run: |
          python -m pip install --upgrade pip build
          if [ -d quantum_runtime_bridge ]; then
            python -m build quantum_runtime_bridge --outdir dist
          elif [ -f pyproject.toml ]; then
            python -m build --outdir dist
          fi
          python -m build codex_game_server --outdir dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
