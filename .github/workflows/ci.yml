name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          if [ -d quantum_runtime_bridge ]; then
            python -m pip install -e quantum_runtime_bridge
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi
          python -m pip install -e codex_game_server
      - name: Run tests
        run: |
          if [ -d quantum_runtime_bridge/tests ]; then
            python -m unittest discover -s quantum_runtime_bridge/tests
          elif [ -d tests ]; then
            python -m unittest discover -s tests
          fi
          python -m unittest discover -s codex_game_server/tests
