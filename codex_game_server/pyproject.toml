[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-game-server"
version = "0.1.0"
description = "A dependency-free CLI helper for declaring, checking, backing up, and launching local game servers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Codex Game Server contributors" }
]
keywords = ["game-server", "cli", "backup", "mods", "plugins", "ops"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Systems Administration"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yokshire/__services__/tree/main/codex_game_server"
Repository = "https://github.com/yokshire/__services__"
Issues = "https://github.com/yokshire/__services__/issues"

[project.scripts]
codex-game-server = "codex_game_server.cli:main"
cgs = "codex_game_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
